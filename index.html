<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family App Library</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8efd9;
      color: #2f2418;
    }

    header {
      padding: 40px 20px;
      text-align: center;
      background: #23415a;
      color: white;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 2.2rem;
    }

    header p {
      margin: 0;
      font-size: 1.1rem;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      gap: 20px;
    }

    .app-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border: 2px solid #e3d1aa;
    }

    .app-card h2 {
      margin-top: 0;
      color: #23415a;
    }

    .app-card p {
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: #d7973d;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #b97828;
    }
  </style>
</head>
<body>
  <header>
    <h1>Family App Library</h1>
    <p>A small collection of apps, games, and stories.</p>
  </header>

  <main>
    <section class="app-card">
      <h2>Picture Book Library</h2>
      <p>Read interactive picture books and story adventures.</p>
      <a class="button" href="PICTURE_BOOK_LINK_HERE">Open Picture Book Library</a>
    </section>

    <section class="app-card">
      <h2>Banking App</h2>
      <p>Practice saving, spending, counting, and money choices.</p>
      <a class="button" href="BANKING_APP_LINK_HERE">Open Banking App</a>
    </section>
  </main>
</body>
</html>
